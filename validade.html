<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Validade e Estoque</title>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #c0392b;
            --light: #ecf0f1;
            --dark: #34495e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--primary);
        }

        h1 { color: var(--primary); }

        /* Formulário */
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: var(--success);
            color: white;
            align-self: flex-end;
            height: 41px;
        }

        .btn-add:hover { background-color: #219653; }

        .btn-print {
            background-color: var(--primary);
            color: white;
            margin-bottom: 20px;
        }

        .btn-print:hover { background-color: #1a252f; }

        /* Tabela e Ações */
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        tr:hover { background-color: #f9f9f9; }

        /* Status de Validade */
        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            display: inline-block;
        }

        .status-vencido { background-color: var(--danger); }
        .status-alerta { background-color: var(--warning); }
        .status-ok { background-color: var(--success); }

        /* Ações do Estoque */
        .actions-cell {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            padding: 5px 8px;
            font-size: 12px;
            color: white;
        }

        .btn-baixa { background-color: #2980b9; }
        .btn-perda { background-color: #e67e22; }
        .btn-del { background-color: var(--danger); }

        /* Estilos Exclusivos para Impressão */
        @media print {
            body {
                background-color: white;
                color: black;
                padding: 0;
            }
            .form-container, .btn-print, .actions-cell, th:last-child, td:last-child {
                display: none !important; /* Esconde formulário, botão de imprimir e coluna de ações */
            }
            .container { width: 100%; }
            table { border: 1px solid #000; }
            th { background-color: #ddd !important; color: #000 !important; }
            td, th { border: 1px solid #000; padding: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Controle de Estoque e Validade</h1>
    </header>

    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Relatório</button>

    <!-- Formulário de Cadastro -->
    <div class="form-container">
        <form id="productForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="pName">Nome do Produto</label>
                    <input type="text" id="pName" required placeholder="Ex: Leite Integral">
                </div>
                <div class="form-group">
                    <label for="pQty">Quantidade em Estoque</label>
                    <input type="number" id="pQty" min="0" required placeholder="Ex: 50">
                </div>
                <div class="form-group">
                    <label for="pDate">Data de Validade</label>
                    <input type="date" id="pDate" required>
                </div>
                <button type="submit" class="btn-add">Adicionar Produto</button>
            </div>
        </form>
    </div>

    <!-- Tabela de Produtos -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Qtd Atual</th>
                    <th>Validade</th>
                    <th>Status</th>
                    <th class="actions-head">Ações de Estoque</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Inserido dinamicamente via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Inicialização dos dados pegando do LocalStorage (ou array vazio)
    let products = JSON.parse(localStorage.getItem('validades_estoque')) || [];

    const productForm = document.getElementById('productForm');
    const tableBody = document.getElementById('productTableBody');

    // Salvar no LocalStorage
    function saveToStorage() {
        localStorage.setItem('validades_estoque', JSON.stringify(products));
        renderProducts();
    }

    // Submit do formulário de cadastro
    productForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('pName').value;
        const qty = parseInt(document.getElementById('pQty').value);
        const date = document.getElementById('pDate').value;

        const newProduct = {
            id: Date.now(),
            name: name,
            qty: qty,
            date: date
        };

        products.push(newProduct);
        saveToStorage();
        productForm.reset();
    });

    // Dar baixa (venda/consumo normal)
    function darBaixa(id) {
        const prod = products.find(p => p.id === id);
        if (prod && prod.qty > 0) {
            prod.qty -= 1;
            saveToStorage();
        } else {
            alert("Estoque zerado!");
        }
    }

    // Registrar perda (descarte/avaria)
    function registrarPerda(id) {
        const prod = products.find(p => p.id === id);
        if (prod && prod.qty > 0) {
            const qtdPerda = prompt(`Quantas unidades de "${prod.name}" deseja dar baixa por PERDA/AVARIA?`, "1");
            const valorPerda = parseInt(qtdPerda);
            
            if (valorPerda > 0 && valorPerda <= prod.qty) {
                prod.qty -= valorPerda;
                alert(`${valorPerda} unidade(s) registrada(s) como perda.`);
                saveToStorage();
            } else if (valorPerda > prod.qty) {
                alert("A quantidade de perda não pode ser maior que o estoque atual.");
            }
        } else {
            alert("Não há estoque para registrar perda!");
        }
    }

    // Excluir produto do sistema
    function excluirProduto(id) {
        if(confirm("Deseja realmente remover este produto do controle?")) {
            products = products.filter(p => p.id !== id);
            saveToStorage();
        }
    }

    // Renderizar tabela na tela
    function renderProducts() {
        tableBody.innerHTML = '';
        
        // Ordena por data de validade mais próxima primeiro
        products.sort((a, b) => new Date(a.date) - new Date(b.date));

        products.forEach(prod => {
            const today = new Date();
            today.setHours(0,0,0,0);
            const valDate = new Date(prod.date);
            valDate.setHours(24,0,0,0); // Ajuste de fuso para o input date

            // Diferença em dias
            const diffTime = valDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            let statusClass = '';
            let statusText = '';

            if (diffDays < 0) {
                statusClass = 'status-vencido';
                statusText = 'VENCIDO';
            } else if (diffDays <= 15) { // Alerta para produtos que vencem em até 15 dias
                statusClass = 'status-alerta';
                statusText = `Vence em ${diffDays} dias`;
            } else {
                statusClass = 'status-ok';
                statusText = 'OK';
            }

            // Formata data padrão brasileiro (DD/MM/AAAA)
            const dateFormatted = valDate.toLocaleDateString('pt-BR', {timeZone: 'UTC'});

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${prod.name}</strong></td>
                <td>${prod.qty} un</td>
