<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Validade e Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #333; }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full {
            grid-column: span 2;
        }
        label { font-weight: bold; margin-bottom: 5px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button {
            grid-column: span 2;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: #007bff; color: white; }
        .vencido { background-color: #f8d7da; color: #721c24; }
        .proximo { background-color: #fff3cd; color: #856404; }
        .btn-excluir {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-excluir:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Validade</h1>
    
    <form id="produtoForm">
        <div class="form-group full">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" required>
        </div>
        <div class="form-group">
            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="1" required>
        </div>
        <div class="form-group">
            <label for="validade">Data de Validade:</label>
            <input type="date" id="validade" required>
        </div>
        <button type="submit">Adicionar Produto</button>
    </form>

    <h2>Lista de Produtos</h2>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Validade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaProdutos">
            <!-- Dados inseridos via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    const form = document.getElementById('produtoForm');
    const tabela = document.getElementById('tabelaProdutos');
    
    let produtos = JSON.parse(localStorage.getItem('produtos')) || [];

    function salvarEAtualizar() {
        localStorage.setItem('produtos', JSON.stringify(produtos));
        renderizarProdutos();
    }

    function verificarStatus(dataValidade) {
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        
        const validade = new Date(dataValidade + 'T00:00:00');
        const diffDias = Math.ceil((validade - hoje) / (1000 * 60 * 60 * 24));

        if (diffDias < 0) {
            return { texto: 'Vencido', classe: 'vencido' };
        } else if (diffDias <= 7) {
            return { texto: `Vence em ${diffDias} dias`, classe: 'proximo' };
        } else {
            return { texto: 'No prazo', classe: '' };
        }
    }

    function renderizarProdutos() {
        tabela.innerHTML = '';
        produtos.forEach((prod, index) => {
            const status = verificarStatus(prod.validade);
            
            const tr = document.createElement('tr');
            tr.className = status.classe;
            
            // Formatar data para DD/MM/AAAA
            const dataFormatada = prod.validade.split('-').reverse().join('/');

            tr.innerHTML = `
                <td>${prod.nome}</td>
                <td>${prod.quantidade}</td>
                <td>${dataFormatada}</td>
                <td>${status.texto}</td>
                <td><button class="btn-excluir" onclick="excluirProduto(${index})">Excluir</button></td>
            `;
            tabela.appendChild(tr);
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const novoProduto = {
            nome: document.getElementById('nome').value,
            quantidade: document.getElementById('quantidade').value,
            validade: document.getElementById('validade').value
        };

        produtos.push(novoProduto);
        salvarEAtualizar();
        form.reset();
    });

    function excluirProduto(index) {
        produtos.splice(index, 1);
        salvarEAtualizar();
    }

    // Inicializar a tabela ao carregar a página
    renderizarProdutos();
</script>

</body>
</html>
