<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th { background-color: #007bff; color: white; }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-delete:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Controle de Estoque</h2>
    
    <div class="form-group">
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" placeholder="Ex: Caneta">
    </div>
    
    <div class="form-group">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" placeholder="Ex: 10">
    </div>
    
    <button onclick="adicionarProduto()">Adicionar ao Estoque</button>

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <!-- Os dados entram aqui via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Carrega o estoque salvo ou inicia um array vazio
    let estoque = JSON.parse(localStorage.getItem('estoque')) || [];

    function salvarEAtualizar() {
        localStorage.setItem('estoque', JSON.stringify(estoque));
        renderizarEstoque();
    }

    function adicionarProduto() {
        const nome = document.getElementById('nome').value.trim();
        const quantidade = parseInt(document.getElementById('quantidade').value);

        if (nome === '' || isNaN(quantidade) || quantidade <= 0) {
            alert('Preencha o nome e uma quantidade válida!');
            return;
        }

        // Verifica se o produto já existe para somar a quantidade
        const produtoExistente = estoque.find(item => item.nome.toLowerCase() === nome.toLowerCase());
        
        if (produtoExistente) {
            produtoExistente.quantidade += quantidade;
        } else {
            estoque.push({ id: Date.now(), nome, quantidade });
        }

        document.getElementById('nome').value = '';
        document.getElementById('quantidade').value = '';
        
        salvarEAtualizar();
    }

    function removerProduto(id) {
        estoque = estoque.filter(item => item.id !== id);
        salvarEAtualizar();
    }

    function renderizarEstoque() {
        const tbody = document.getElementById('tabela-corpo');
        tbody.innerHTML = '';

        estoque.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.nome}</td>
                <td>${item.quantidade}</td>
                <td><button class="btn-delete" onclick="removerProduto(${item.id})">Excluir</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Executa ao carregar a página
    renderizarEstoque();
</script>

</body>
</html>
