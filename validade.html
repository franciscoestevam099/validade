<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Validade de Produtos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Formulário */
        .form-cadastro {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
            height: 41px;
        }

        button:hover {
            background-color: #219653;
        }

        /* Tabela e Alertas */
        .tabela-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #edf2f7;
        }

        th {
            background-color: #f8f9fa;
            color: #718096;
            font-weight: 600;
        }

        .status-vencido {
            background-color: #ffebee;
            color: #c62828;
            font-weight: bold;
        }

        .status-alerta {
            background-color: #fffde7;
            color: #f57f17;
            font-weight: bold;
        }

        .status-ok {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .btn-excluir {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
            height: auto;
        }

        .btn-excluir:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Validade</h1>

    <!-- Formulário de Cadastro -->
    <form class="form-cadastro" id="formProduto">
        <div class="form-group">
            <label id="lblProduto" for="produto">Produto</label>
            <input type="text" id="produto" required placeholder="Ex: Leite Integral">
        </div>
        <div class="form-group">
            <label id="lblQuantidade" for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" required placeholder="Ex: 10">
        </div>
        <div class="form-group">
            <label id="lblValidade" for="validade">Data de Validade</label>
            <input type="date" id="validade" required>
        </div>
        <button type="submit">Adicionar</button>
    </form>

    <!-- Tabela de Produtos -->
    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Validade</th>
                    <th>Status / Dias Restantes</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaProdutos">
                <!-- Inserido dinamicamente via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Carregar produtos salvos ou iniciar lista vazia
    let produtos = JSON.parse(localStorage.getItem('produtos_validade')) || [];

    const formProduto = document.getElementById('formProduto');
    const listaProdutos = document.getElementById('listaProdutos');

    // Salvar e atualizar visualização
    function atualizarPainel() {
        localStorage.setItem('produtos_validade', JSON.stringify(produtos));
        renderizarProdutos();
    }

    // Adicionar novo produto
    formProduto.addEventListener('submit', (e) => {
        e.preventDefault();

        const novoProduto = {
            id: Date.now(),
            nome: document.getElementById('produto').value,
            quantidade: document.getElementById('quantidade').value,
            validade: document.getElementById('validade').value
        };

        produtos.push(novoProduto);
        atualizarPainel();
        formProduto.reset();
    });

    // Excluir produto
    function excluirProduto(id) {
        produtos = produtos.filter(p => p.id !== id);
        atualizarPainel();
    }

    // Formatar data para padrão brasileiro (DD/MM/AAAA)
    function formatarData(dataString) {
        const [ano, mes, dia] = dataString.split('-');
        return `${dia}/${mes}/${ano}`;
    }

    // Renderizar a tabela na tela
    function renderizarProdutos() {
        listaProdutos.innerHTML = '';

        if (produtos.length === 0) {
            listaProdutos.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#718096;">Nenhum produto cadastrado.</td></tr>`;
            return;
        }

        // Ordenar do mais próximo de vencer para o mais distante
        produtos.sort((a, b) => new Date(a.validade) - new Date(b.validade));

        produtos.forEach(p => {
            const hoje = new Date();
            hoje.setHours(0,0,0,0);
            const dataValidade = new Date(p.validade);
            dataValidade.setHours(24,0,0,0); // Ajuste de fuso horário local

            // Calcular diferença de dias
            const diferencaTempo = dataValidade - hoje;
            const diferencaDias = Math.ceil(diferencaTempo / (1000 * 60 * 60 * 24));

            let classeStatus = 'status-ok';
            let textoStatus = `${diferencaDias} dias restantes`;

            if (diferencaDias < 0) {
                classeStatus = 'status-vencido';
                textoStatus = `VENCIDO (há ${Math.abs(diferencaDias)} dias)`;
            } else if (diferencaDias === 0) {
                classeStatus = 'status-alerta';
                textoStatus = 'Vence HOJE!';
            } else if (diferencaDias <= 7) {
                classeStatus = 'status-alerta';
                textoStatus = `Atenção: vence em ${diferencaDias} dias`;
            }

            const tr = document.createElement('tr');
            tr.className = classeStatus;
            tr.innerHTML = `
                <td><strong>${p.nome}</strong></td>
                <td>${p.quantidade}</td>
                <td>${formatarData(p.validade)}</td>
                <td>${textoStatus}</td>
                <td><button class="btn-excluir" onclick="excluirProduto(${p.id})">Excluir</button></td>
            `;
            listaProdutos.appendChild(tr);
        });
    }

    // Inicializar na primeira execução
    renderizarProdutos();
</script>

</body>
</html>
